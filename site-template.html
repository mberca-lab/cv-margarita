<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Margarita Bermejo Cano: people science, AI adoption research, customer insights and workforce analytics. Explore public research, selected projects and career experience.">
  <meta name="color-scheme" content="light dark">
  <meta name="portfolio-version" content="3">
  <meta property="og:title" content="Margarita Bermejo Cano | People Science & Analytics">
  <meta property="og:description" content="Research, measurement and practical insight at the intersection of people, products and AI.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mberca.github.io/cv-margarita/">
  <link rel="canonical" href="https://mberca.github.io/cv-margarita/">
  <title>Margarita Bermejo Cano | People Science &amp; Analytics</title>
  <script>
    (() => {
      const themes = ["light", "dark", "premium", "retro95"];
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      let theme = themes.includes(param) ? param : null;
      if (!theme) {
        try {
          const saved = window.localStorage.getItem("portfolio-theme");
          if (themes.includes(saved)) theme = saved;
        } catch (error) {
          if (error.name !== "SecurityError") throw error;
          console.warn("Theme storage is unavailable; using the browser's colour preference.");
        }
      }
      document.documentElement.setAttribute("data-theme",
        theme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    html[data-theme="premium"] {
      color-scheme: light;
      --cp-bg: #f7f2e8;
      --cp-bg-elevated: #fffdf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #eee7da;
      --cp-border: #d5cbb9;
      --cp-border-strong: #93836b;
      --cp-text: #18263b;
      --cp-text-muted: #525967;
      --cp-text-soft: #666152;
      --cp-accent: #7a5518;
      --cp-accent-hover: #62410d;
      --cp-accent-soft: rgba(122, 85, 24, 0.06);
      --cp-accent-fg: #ffffff;
      --cp-link: #274b75;
      --cp-shadow: 0 20px 50px rgba(24, 38, 59, 0.08);
      --cp-highlight: rgba(122, 85, 24, 0.12);
    }
    html[data-theme="retro95"] {
      color-scheme: light;
      --cp-bg: #d4d0c8;
      --cp-bg-elevated: #efefef;
      --cp-surface: #ffffff;
      --cp-surface-soft: #c0c0c0;
      --cp-border: #919191;
      --cp-border-strong: #555555;
      --cp-text: #171717;
      --cp-text-muted: #444444;
      --cp-text-soft: #555555;
      --cp-accent: #000080;
      --cp-accent-hover: #000050;
      --cp-accent-soft: rgba(0, 0, 128, 0.04);
      --cp-accent-fg: #ffffff;
      --cp-link: #000080;
      --cp-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
      --cp-highlight: rgba(0, 128, 128, 0.16);
      --cp-desktop: #008080;
      --cp-bevel-light: #ffffff;
      --cp-bevel-dark: #555555;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.65; }
    a { color: inherit; text-underline-offset: 4px; }
    button, select { font: inherit; cursor: pointer; }
    :is(a, button, select, summary):focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 5px; }
    [hidden] { display: none !important; }
    h1, h2, h3, p, figure { margin: 0; }
    .skip { position: fixed; top: -100px; left: 16px; z-index: 30; padding: 12px 20px; background: var(--cp-surface); }
    .skip:focus { top: 16px; }
    .topbar { position: sticky; top: 0; z-index: 10; background: var(--cp-bg); border-bottom: 1px solid var(--cp-border); }
    .topbar-inner { max-width: 1320px; margin: auto; padding: 16px 48px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .monogram { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--cp-accent); color: var(--cp-accent-fg); font: italic 22px Georgia, serif; }
    .brand-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
    nav { display: flex; align-items: center; gap: 24px; }
    .topbar nav a { font-size: 13px; text-decoration: none; padding: 12px 0; }
    .topbar nav a:hover { color: var(--cp-accent); }
    .theme { min-height: 44px; padding: 8px 12px; background: var(--cp-bg-elevated); color: var(--cp-text); border: 1px solid var(--cp-border); border-radius: .625rem; font-size: 12px; }
    .theme-picker { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .theme-status { max-width: 1320px; margin: auto; padding: 0 20px 12px; font-size: 12px; color: var(--cp-text-muted); }
    .main { max-width: 1320px; margin: auto; padding: 0 48px 32px; }
    .eyebrow, .meta, .tag, .date, .folio { font-family: Consolas, "Courier New", Courier, monospace; }
    .eyebrow { color: var(--cp-accent); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 64px; align-items: center; padding: 56px 0 32px; }
    .hero-name { font-size: 21px; font-weight: 600; margin-top: 16px; }
    .hero-role { font-size: 15px; font-weight: 600; color: var(--cp-accent); margin-top: 4px; }
    h1 { font: 400 clamp(54px, 5.4vw, 76px)/1.04 Georgia, "Times New Roman", serif; letter-spacing: -.06em; margin: 24px 0; }
    h1 em { color: var(--cp-accent); font-weight: 400; }
    .intro { font-size: 17px; color: var(--cp-text-muted); line-height: 1.8; max-width: 570px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 12px; min-height: 48px; padding: 12px 20px; border: 1px solid var(--cp-border-strong); border-radius: .625rem; background: var(--cp-bg-elevated); color: var(--cp-text); font-size: 13px; text-decoration: none; }
    .button.primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
    .button.primary:hover { background: var(--cp-accent-hover); }
    .button:not(.primary):hover { border-color: var(--cp-accent); }
    .hero-caption { font-size: 12px; color: var(--cp-text-muted); margin-top: 16px; }
    .hero-evidence { border-top: 2px solid var(--cp-accent); }
    .hero-evidence > .eyebrow { padding: 16px 0 4px; }
    .proof { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--cp-border); text-decoration: none; }
    .proof strong { display: block; font: 400 26px/1.15 Georgia, serif; letter-spacing: -.025em; }
    .proof p { font-size: 14px; color: var(--cp-text-muted); margin-top: 8px; }
    .proof div > span { display: block; font: 11px/1.5 Consolas, monospace; color: var(--cp-accent); margin-top: 12px; }
    .proof-index { font: italic 25px/1 Georgia, serif; color: var(--cp-accent); padding-top: 2px; }
    .proof:hover strong { text-decoration: underline; text-underline-offset: 5px; }
    section { padding-top: 72px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding-top: 20px; border-top: 1px solid var(--cp-border); margin-bottom: 24px; }
    .section-head .eyebrow { order: 2; white-space: nowrap; }
    h2 { font: 400 clamp(34px, 3.5vw, 48px)/1.15 Georgia, serif; letter-spacing: -.045em; }
    .section-intro { font-size: 16px; color: var(--cp-text-muted); max-width: 760px; margin-bottom: 28px; }
    .principles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .principles article { padding: 24px 0; border-top: 1px solid var(--cp-border-strong); }
    .principle-mark { font: italic 42px Georgia, serif; color: var(--cp-accent); margin-bottom: 20px; }
    .principles h3 { font-size: 17px; margin-bottom: 12px; }
    .principles p { font-size: 14px; color: var(--cp-text-muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filter { min-height: 44px; padding: 8px 16px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-bg-elevated); color: var(--cp-text); font-size: 13px; }
    .filter[aria-pressed="true"] { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .project-count { font-size: 12px; color: var(--cp-text-muted); margin-bottom: 20px; }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .project { position: relative; overflow: hidden; padding: 32px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-bg-elevated); }
    .project-lead { grid-column: 1 / -1; background: var(--cp-accent-soft); padding: 36px; }
    .project-number { position: absolute; right: 24px; top: 24px; font: italic 96px/1 Georgia, serif; color: var(--cp-accent); opacity: .1; pointer-events: none; }
    .project-lead .project-number { font-size: 144px; right: 36px; }
    .project .meta { display: flex; justify-content: space-between; gap: 16px; font-size: 11px; color: var(--cp-text-muted); position: relative; }
    .project h3 { position: relative; font: 400 32px/1.18 Georgia, serif; letter-spacing: -.03em; margin: 28px 0 16px; max-width: 600px; }
    .project-lead h3 { font-size: 42px; }
    .project > p { position: relative; color: var(--cp-text-muted); font-size: 15px; max-width: 700px; }
    .project .project-employer { color: var(--cp-accent); font-size: 13px; font-weight: 600; margin-top: 20px; }
    .project h3 { margin-top: 10px; }
    .project .project-link { margin-top: 16px; color: var(--cp-accent); }
    .tags { position: relative; display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .tag { font-size: 11px; padding: 4px 8px; border: 1px solid var(--cp-border); border-radius: 6px; color: var(--cp-text); background: var(--cp-bg); }
    .status { position: relative; font-size: 12px; color: var(--cp-text-muted); margin-bottom: 12px; }
    details { border-top: 1px solid var(--cp-border); }
    summary { position: relative; color: var(--cp-accent); font-size: 14px; padding: 16px 0; cursor: pointer; }
    .case { display: grid; gap: 20px; margin: 4px 0 8px; }
    .case-overview { margin-top: 24px; }
    .project-lead .case-overview { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
    .case dt { font-size: 12px; font-weight: 700; }
    .case dd { margin: 6px 0 0; color: var(--cp-text-muted); font-size: 14px; }
    .more-work { margin-top: 24px; }
    .more-work > summary { font-size: 16px; font-weight: 600; }
    .more-work > .projects { margin-top: 12px; }
    .publication { display: grid; grid-template-columns: 1.6fr 1fr; gap: 48px; background: var(--cp-accent); color: var(--cp-accent-fg); padding: 44px; border-radius: 16px; }
    .publication .eyebrow { color: var(--cp-accent-fg); }
    .publication h3 { font: 400 38px/1.15 Georgia, serif; margin: 20px 0; letter-spacing: -.035em; }
    .publication p { font-size: 15px; }
    .publication .button { margin-top: 24px; background: var(--cp-accent-fg); color: var(--cp-accent); border-color: var(--cp-accent-fg); }
    .publication .button:focus-visible { outline-color: var(--cp-accent-fg); }
    .publication-proof { border-left: 1px solid var(--cp-accent-fg); padding-left: 36px; align-self: center; }
    .publication-proof strong { display: block; font: 400 64px/1 Georgia, serif; }
    .publication-proof p { margin-top: 12px; font-size: 14px; }
    .research-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
    .research-notes article { padding: 24px; border: 1px solid var(--cp-border); border-radius: 16px; }
    .research-notes h3 { font-size: 17px; margin-bottom: 12px; }
    .research-notes p { font-size: 14px; color: var(--cp-text-muted); }
    .research-notes .button { margin-top: 20px; }
    .contributions { margin-top: 32px; }
    .contributions h3 { font-size: 17px; }
    .contributions details { padding: 0 8px; }
    .contributions summary { color: var(--cp-text); font-weight: 600; }
    .contributions ul { margin: 0 0 24px; padding-left: 20px; max-width: 960px; color: var(--cp-text-muted); font-size: 14px; }
    .contributions li + li { margin-top: 10px; }
    .timeline { display: grid; grid-template-columns: repeat(6, 1fr); margin-bottom: 28px; }
    .timeline a { font-size: 12px; padding: 20px 8px 12px 0; border-top: 2px solid var(--cp-accent); text-decoration: none; }
    .job { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 32px; padding: 28px 0; border-bottom: 1px solid var(--cp-border); }
    .date { font-size: 12px; color: var(--cp-text-muted); }
    .job h3 { font-size: 20px; line-height: 1.35; }
    .job .org { color: var(--cp-accent); font-size: 15px; margin: 4px 0 12px; }
    .job .scope { font-size: 14px; color: var(--cp-text-muted); }
    .job-detail { border-top: 0; margin-top: 4px; }
    .job-detail summary { padding: 8px 0; font-size: 13px; }
    .job-detail ul { padding-bottom: 16px; }
    .job ul { padding-left: 20px; margin: 0; color: var(--cp-text-muted); font-size: 14px; }
    .job li + li { margin-top: 8px; }
    .early-career { margin-top: 28px; }
    .early-career summary { font-weight: 600; color: var(--cp-text); }
    .methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .methods article { padding: 28px; background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 16px; }
    .methods h3 { font-size: 17px; margin-bottom: 20px; }
    .methods ul { list-style: none; padding: 0; margin: 0; color: var(--cp-text-muted); font-size: 14px; }
    .methods li { border-top: 1px solid var(--cp-border); padding: 10px 0; }
    .education { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 40px; }
    .education article { border-left: 2px solid var(--cp-accent); padding-left: 20px; }
    .education h3 { font-size: 17px; }
    .education p { color: var(--cp-text-muted); font-size: 14px; margin-top: 8px; }
    .certification { margin-top: 28px; font-size: 14px; color: var(--cp-text-muted); }
    .closing { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 44px; background: var(--cp-text); color: var(--cp-bg); border-radius: 16px; margin-top: 72px; }
    .closing h2 { font-size: 42px; }
    .closing p { margin-top: 16px; font-size: 15px; }
    .closing .button { background: var(--cp-bg); color: var(--cp-text); border-color: var(--cp-bg); }
    .resource-list { display: grid; gap: 12px; align-content: start; }
    .resource-list a { justify-content: space-between; }
    .contact-note { font-size: 12px !important; margin-top: 0 !important; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-top: 24px; margin-top: 24px; color: var(--cp-text-muted); font-size: 12px; }
    html[data-theme="dark"] :is(.intro, .hero-caption, .proof p, .principles p, .section-intro, .project .meta, .project > p, .status, .project-count, .case dd, .research-notes p, .contributions ul, .date, .job .scope, .job ul, .methods ul, .education p, .certification, footer) { color: var(--cp-text-soft); }
    @media screen {
      html[data-theme="premium"] .topbar { border-bottom-color: var(--cp-accent); }
      html[data-theme="premium"] .topbar nav a { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
      html[data-theme="premium"] .hero-name { font-family: Georgia, serif; font-size: 26px; font-weight: 400; }
      html[data-theme="premium"] :is(.project, .publication, .research-notes article, .methods article, .closing) { border-radius: 2px; }
      html[data-theme="premium"] .project-lead { border-left: 4px solid var(--cp-accent); background: var(--cp-bg-elevated); }
      html[data-theme="premium"] .section-head { border-top-color: var(--cp-accent); }
      html[data-theme="premium"] .publication { background: var(--cp-text); }
      html[data-theme="premium"] .publication .button { color: var(--cp-text); }
      html[data-theme="retro95"] body { background: var(--cp-desktop); font-family: Tahoma, Verdana, sans-serif; }
      html[data-theme="retro95"] .shell { padding: 12px; }
      html[data-theme="retro95"] .topbar { top: 12px; max-width: 1320px; margin: auto; }
      html[data-theme="retro95"] .main { background: var(--cp-bg); }
      html[data-theme="retro95"] :is(.topbar, .main, .project, .research-notes article, .methods article) {
        border: 2px solid;
        border-color: var(--cp-bevel-light) var(--cp-bevel-dark) var(--cp-bevel-dark) var(--cp-bevel-light);
        border-radius: 0;
        box-shadow: var(--cp-shadow);
      }
      html[data-theme="retro95"] :is(.button, .theme, .filter) {
        border: 2px solid;
        border-color: var(--cp-bevel-light) var(--cp-bevel-dark) var(--cp-bevel-dark) var(--cp-bevel-light);
        border-radius: 0;
        box-shadow: 1px 1px 0 var(--cp-text);
      }
      html[data-theme="retro95"] :is(.button, .filter):active {
        border-color: var(--cp-bevel-dark) var(--cp-bevel-light) var(--cp-bevel-light) var(--cp-bevel-dark);
        box-shadow: none;
      }
      html[data-theme="retro95"] :is(.monogram, .tag, .publication, .closing) { border-radius: 0; }
      html[data-theme="retro95"] :is(.hero h1, .section-head h2, .project h3, .publication h3, .closing h2, .proof strong) { font-family: Tahoma, Verdana, sans-serif; font-weight: 700; }
      html[data-theme="retro95"] .hero h1 { font-size: clamp(34px, 5.8vw, 72px); letter-spacing: -.045em; }
      html[data-theme="retro95"] .hero h1 em { font-style: normal; }
      html[data-theme="retro95"] .project { padding-top: 58px; }
      html[data-theme="retro95"] .project::before {
        content: "SELECTED WORK";
        position: absolute; top: 3px; left: 3px; right: 3px;
        padding: 4px 12px; background: var(--cp-accent); color: var(--cp-accent-fg);
        font: 700 12px/1.5 Tahoma, Verdana, sans-serif; letter-spacing: .05em;
      }
    }
    .print-resume { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .hero-copy { animation: arrive .65s ease-out both; }
      .hero-evidence { animation: arrive .75s .1s ease-out both; }
      .project { transition: transform .2s, border-color .2s; }
      .project:hover { transform: translateY(-3px); border-color: var(--cp-accent); }
      @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    }
    @media (max-width: 1100px) {
      .main, .topbar-inner { padding-left: 32px; padding-right: 32px; }
      nav { gap: 16px; }
      .hero { gap: 32px; }
      h1 { font-size: 66px; }
    }
    @media (max-width: 900px) {
      .topbar-inner { gap: 12px; }
      .hero { grid-template-columns: 1fr; padding-top: 36px; gap: 32px; }
      .hero-evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      .hero-evidence > .eyebrow { grid-column: 1 / -1; padding-bottom: 0; }
      .proof { grid-template-columns: 1fr; gap: 12px; padding-top: 0; }
      .proof strong { font-size: 23px; }
      .publication, .closing { grid-template-columns: 1fr; gap: 28px; }
      .publication-proof { border-left: 0; border-top: 1px solid var(--cp-accent-fg); padding: 24px 0 0; }
      .publication-proof strong { font-size: 48px; }
      .methods { grid-template-columns: 1fr; }
      .job { grid-template-columns: 150px 1fr; gap: 24px; }
    }
    @media (max-width: 600px) {
